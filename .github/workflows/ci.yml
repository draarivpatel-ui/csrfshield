name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify zero runtime dependencies
        run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies || {}).length) process.exit(1)"
      - name: Run tests
        run: npm test
      - name: Run fast-check property fuzz tests
        run: npm run test:fuzz
      - name: Verify generated CommonJS build
        run: |
          npm run build:cjs
          git diff --exit-code -- cjs
