name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify zero runtime dependencies
        run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies).length || Object.keys(p.devDependencies).length) process.exit(1)"
      - name: Run tests
        run: npm test
      - name: Verify generated CommonJS build
        run: |
          npm run build:cjs
          git diff --exit-code -- cjs
